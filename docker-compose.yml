name: cinesense

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cinesense}
      POSTGRES_USER: ${POSTGRES_USER:-cinesense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinesense} -d ${POSTGRES_DB:-cinesense}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
