spring.application.name=cinesense-api
server.port=${API_PORT:8080}
management.endpoints.web.exposure.include=health,info
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cinesense}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cinesense}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-locally}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.health.db.enabled=true
